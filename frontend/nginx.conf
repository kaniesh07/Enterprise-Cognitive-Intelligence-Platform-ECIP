server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    client_max_body_size 60m;            # document uploads

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # All API calls from the UI go to /api/* (FastAPI also accepts the /api prefix,
    # so the same UI works without nginx).
    location /api/ {
        proxy_pass http://api:8000;      # keep the /api prefix; the API strips it
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-Sent Events: never buffer, allow long generations
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health { proxy_pass http://api:8000/health; }
}
