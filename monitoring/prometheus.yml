global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    project: ecip

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ecip-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
